name: Check code style

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-style:
    name: Check code style with clang-format
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v3
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install clang-format
        run: |
          echo "Updating packages"
          sudo apt-get update
          sudo apt-get upgrade
          echo "Adding LLVM repository"
          sudo add-apt-repository 'deb http://apt.llvm.org/bionic/ llvm-toolchain-bionic main'
          echo "Adding LLVM key"
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo apt update
          sudo apt install clang-format-16
          echo "The basic installed version of clang-format is $(clang-format --version)"
          echo "The installed version of clang-format-16 is $(clang-format-16 --version)"
      - name: Run clang-format
        run: |
          find src/ include/ scripts/ \
          -type f -name "*.hpp" -o \
          -type f -name "*.cpp" -o \
          -type f -name "*.C.in" -o \
          -type f -name "*.h.in" | xargs clang-format --style=file --dry-run --Werror
