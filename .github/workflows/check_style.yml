name: Check code style

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-style:
    name: Check code formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          python -m pip install --disable-pip-version-check "cmakelang==0.6.13"

          clang-format-18 --version
          cmake-format --version

      - name: Check C/C++ formatting
        shell: bash
        run: |
          set -euo pipefail

          find src scripts -type f \
            \( -name '*.h' -o \
               -name '*.hpp' -o \
               -name '*.c' -o \
               -name '*.cc' -o \
               -name '*.cpp' -o \
               -name '*.C.in' -o \
               -name '*.h.in' \) \
            -print0 |
            xargs -0 --no-run-if-empty clang-format-18 \
              --style=file \
              --dry-run \
              --Werror

      - name: Check CMake formatting
        shell: bash
        run: |
          set -euo pipefail

          find . \
            \( -type d \( \
                -name build -o \
                -name dependency_install -o \
                -name .git \
            \) -prune \) \
            -o \
            \( -type f \( \
                -name 'CMakeLists.txt' -o \
                -name '*.cmake' \
            \) -print0 \) |
            xargs -0 --no-run-if-empty cmake-format --check
